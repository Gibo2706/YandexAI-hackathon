name: Deploy Pipeline

on:
  push:
    branches:
      - develop  # Pokreće pipeline pri svakom pushu na 'develop' granu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repozitorijuma
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Deploy i restart servisa na VM-u putem SSH
      - name: Deploy and restart services on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.YC_VM_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 2.1 Pull poslednjih promena u root direktorijumu
            cd /home/ubuntu/hackathon/YandexAI-hackathon
            git pull origin develop  # Samo jednom u root folderu

            # 2.2 Backend: Instalacija zavisnosti
            cd /home/ubuntu/hackathon/YandexAI-hackathon/backend
            sudo pip install --ignore-installed -r requirements.txt
            
            # 2.3 Restartovanje FastAPI servisa
            sudo systemctl restart fastapi.service
            
            # 2.4 Frontend: Instalacija zavisnosti i build
            cd /home/ubuntu/hackathon/YandexAI-hackathon/frontend/app
            npm install
            npm run build

            # 2.5 Kopiranje build-a na server
            sudo rm -rf /var/www/frontend/*
            sudo mkdir -p /var/www/frontend
            sudo cp -r dist/* /var/www/frontend/
            
            # 2.6 Restartovanje nginx servisa
            sudo systemctl restart nginx
